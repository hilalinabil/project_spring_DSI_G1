# Test copy of src/main/resources/application.yaml (same name, so it replaces it
# on the test classpath). Tests run without a Config Server or Eureka: there is
# no configserver: import here, and the route that normally comes from the
# ticketFlow-config repo is given inline.
spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            - id: customer-service
              uri: lb://customer-service
              predicates:
                - Path=/api/customers/**
            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
eureka:
  client:
    enabled: false
