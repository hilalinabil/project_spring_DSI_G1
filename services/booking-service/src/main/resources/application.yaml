# Everything else (port, datasource, JPA, Feign timeouts, actuator) comes from
# booking-service.yaml in the ticketFlow-config repo. No optional: the service
# refuses to start without the config server.
spring:
  application:
    name: booking-service
  config:
    import: "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      label: main
