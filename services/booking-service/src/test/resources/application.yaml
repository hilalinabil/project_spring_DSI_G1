# Test copy of src/main/resources/application.yaml (same name, so it replaces it
# on the test classpath). Tests run without a Config Server, Eureka, MySQL or the
# remote services: no configserver: import here, H2 in-memory (test scope),
# values inlined. Feign clients are mocked in the unit tests; the circuit
# breaker test points them at a local stub server.
#
# Feign + circuit breaker settings: same values as booking-service.yaml in the
# config repo (keep in sync).
spring:
  application:
    name: booking-service
  cloud:
    config:
      enabled: false
    openfeign:
      client:
        config:
          event-service:
            connect-timeout: 2000
            read-timeout: 3000
          customer-service:
            connect-timeout: 2000
            read-timeout: 3000
      circuitbreaker:
        enabled: true
        group:
          enabled: true
  # No broker in the tests (publisher mocked or KafkaTemplate mocked). Same
  # producer settings as the config repo; max.block.ms keeps an accidental
  # send from hanging.
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      client-id: booking-service
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 2000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
management:
  endpoint:
    health:
      show-details: always
ticketflow:
  kafka:
    topics:
      booking-created: ticketflow.booking.created
resilience4j:
  circuitbreaker:
    configs:
      remote-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - feign.RetryableException
          - com.ticketflow.bookingservice.exception.ServiceUnavailableException
          - java.util.concurrent.TimeoutException
        ignore-exceptions:
          - com.ticketflow.bookingservice.exception.RemoteNotFoundException
          - com.ticketflow.bookingservice.exception.RemoteConflictException
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - jakarta.validation.ValidationException
    instances:
      event-service:
        base-config: remote-service
      customer-service:
        base-config: remote-service
  timelimiter:
    configs:
      remote-service:
        timeout-duration: 4s
    instances:
      event-service:
        base-config: remote-service
      customer-service:
        base-config: remote-service
