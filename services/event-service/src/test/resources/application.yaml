# Test copy of src/main/resources/application.yaml (same name, so it replaces it
# on the test classpath). Tests run without a Config Server, Eureka or MySQL:
# no configserver: import here, H2 in-memory (test scope), values inlined.
spring:
  application:
    name: event-service
  cloud:
    config:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
eureka:
  client:
    enabled: false
