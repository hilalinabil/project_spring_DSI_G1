# TicketFlow - full stack. Run from the repo root:
#   cp .env.example .env   (then set real passwords)
#   docker compose up -d --build
# Published: gateway (8080); Eureka dashboard (8761), MySQL (3306) and Kafka's
# host listener (9094) on 127.0.0.1 only.
# Business services are reachable only through the gateway.

name: ticketflow

x-java-service: &java-service
  restart: unless-stopped
  networks: [ticketflow]

services:
  mysql:
    image: mysql:8.4
    container_name: ticketflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      CUSTOMER_DB_PASSWORD: ${CUSTOMER_DB_PASSWORD:?set CUSTOMER_DB_PASSWORD in .env}
      EVENT_DB_PASSWORD: ${EVENT_DB_PASSWORD:?set EVENT_DB_PASSWORD in .env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set BOOKING_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    # Published on the loopback interface ONLY (not reachable from the LAN), so a
    # service can also run outside Docker with ./mvnw spring-boot:run.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # TCP (127.0.0.1), not the socket: the temporary init server runs with
      # --skip-networking, so this only succeeds once the real server is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks: [ticketflow]

  # Single-node Kafka in KRaft mode (broker + controller in one process, no
  # ZooKeeper). Three listeners on three DIFFERENT ports:
  #   PLAINTEXT  kafka:9092      containers on the ticketflow network
  #   EXTERNAL   localhost:9094  tools/apps on the host (127.0.0.1 only)
  #   CONTROLLER :9093           KRaft quorum, internal, not published
  # The image runs as the non-root user "appuser" (uid 1000).
  kafka:
    image: apache/kafka:4.0.0
    container_name: ticketflow-kafka
    restart: unless-stopped
    environment:
      # Fixed: the data volume is formatted with it and must match on every start.
      CLUSTER_ID: JTabeRj0SiSH8QU2oFdtgg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker: every replication factor / min ISR is 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by kafka-init only: a typo in a topic name fails
      # instead of silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image's default is /tmp/kraft-combined-logs: point it at the volume.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      start_period: 30s
      retries: 10
    networks: [ticketflow]

  # One-shot: creates the TicketFlow topics (idempotent: --if-not-exists),
  # then exits 0. Same image, same non-root user.
  kafka-init:
    image: apache/kafka:4.0.0
    container_name: ticketflow-kafka-init
    restart: "no"
    entrypoint: ["bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP_SERVER: kafka:9092
    volumes:
      - ./docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks: [ticketflow]

  config-server:
    <<: *java-service
    build:
      context: .
      dockerfile: services/config-server/Dockerfile
    image: ticketflow/config-server:local
    container_name: ticketflow-config-server
    environment:
      CONFIG_GIT_URI: ${CONFIG_GIT_URI:?set CONFIG_GIT_URI in .env}
      CONFIG_GIT_USERNAME: ${CONFIG_GIT_USERNAME:-}
      CONFIG_GIT_TOKEN: ${CONFIG_GIT_TOKEN:-}

  discovery-server:
    <<: *java-service
    build:
      context: .
      dockerfile: services/discovery-server/Dockerfile
    image: ticketflow/discovery-server:local
    container_name: ticketflow-discovery-server
    ports:
      - "127.0.0.1:8761:8761"
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy

  customer-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    image: ticketflow/customer-service:local
    container_name: ticketflow-customer-service
    environment:
      # Its local application.yml is frozen and hard-codes a localhost import.
      # Imports are processed per file, so SPRING_CONFIG_IMPORT alone would ADD
      # an import and the file's localhost one would still fail. Instead, skip
      # the packaged application.yml (empty config location) and give its
      # three settings here. Everything else comes from the config repo.
      SPRING_CONFIG_LOCATION: optional:file:/app/config/
      SPRING_APPLICATION_NAME: customer-service
      SPRING_CLOUD_CONFIG_LABEL: main
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_HOST: mysql
      DB_USERNAME: customer_user
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      discovery-server:
        condition: service_healthy

  event-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/event-service/Dockerfile
    image: ticketflow/event-service:local
    container_name: ticketflow-event-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_HOST: mysql
      DB_USERNAME: event_user
      DB_PASSWORD: ${EVENT_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  booking-service:
    <<: *java-service
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    image: ticketflow/booking-service:local
    container_name: ticketflow-booking-service
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      DB_HOST: mysql
      DB_USERNAME: booking_user
      DB_PASSWORD: ${BOOKING_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # Calls event-service and customer-service (OpenFeign, through Eureka).
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      event-service:
        condition: service_healthy
      customer-service:
        condition: service_healthy

  api-gateway:
    <<: *java-service
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: ticketflow/api-gateway:local
    container_name: ticketflow-api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      customer-service:
        condition: service_healthy

networks:
  ticketflow:
    name: ticketflow

volumes:
  mysql-data:
  kafka-data:
